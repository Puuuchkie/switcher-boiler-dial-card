<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 200" width="500" height="200">
  <defs>
    <filter id="cs" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="8" flood-color="#000" flood-opacity="0.10"/>
    </filter>
  </defs>

  <!-- Dashboard background -->
  <rect width="500" height="200" fill="#f0f2f5"/>

  <!-- ═══════════════════════════════════════════════════════════
       LEFT CARD — device OFF
       ═══════════════════════════════════════════════════════════ -->
  <rect x="18" y="18" width="220" height="158" rx="14" fill="white" filter="url(#cs)"/>

  <!-- Icon circle (gray = off) -->
  <circle cx="52" cy="62" r="18" fill="rgba(158,158,158,0.2)"/>
  <!-- Wave icon placeholder -->
  <text x="52" y="67" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="16" fill="#9e9e9e">〜</text>

  <!-- Name + state -->
  <text x="80" y="57" font-family="system-ui,-apple-system,sans-serif" font-size="14" font-weight="500" fill="#212121">Boiler</text>
  <text x="80" y="73" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#9e9e9e">off</text>

  <!-- Three control buttons: power | timer | 30 -->
  <!-- Power button (off = gray) -->
  <rect x="30" y="108" width="52" height="42" rx="10" fill="rgba(158,158,158,0.2)"/>
  <text x="56" y="133" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="18" fill="#424242">⏻</text>

  <!-- Timer icon button -->
  <rect x="90" y="108" width="52" height="42" rx="10" fill="rgba(158,158,158,0.2)"/>
  <text x="116" y="133" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="16" fill="#424242">⏱</text>

  <!-- Timer value button -->
  <rect x="150" y="108" width="74" height="42" rx="10" fill="rgba(158,158,158,0.2)"/>
  <text x="187" y="133" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="18" font-weight="500" fill="#424242">30</text>


  <!-- ═══════════════════════════════════════════════════════════
       RIGHT CARD — device ON
       ═══════════════════════════════════════════════════════════ -->
  <rect x="262" y="18" width="220" height="158" rx="14" fill="white" filter="url(#cs)"/>

  <!-- Icon circle (red = on) -->
  <circle cx="296" cy="62" r="18" fill="rgba(245,68,54,0.2)"/>
  <text x="296" y="67" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="16" fill="#F54436">〜</text>

  <!-- Name + state (time left + sensor) -->
  <text x="324" y="55" font-family="system-ui,-apple-system,sans-serif" font-size="14" font-weight="500" fill="#212121">Boiler</text>
  <text x="324" y="71" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#9e9e9e">00:28:45 · 2.4 A</text>

  <!-- Three control buttons: power | timer | 30 -->
  <!-- Power button (on = red) -->
  <rect x="274" y="108" width="52" height="42" rx="10" fill="#F54436"/>
  <text x="300" y="133" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="18" fill="white">⏻</text>

  <!-- Timer icon button -->
  <rect x="334" y="108" width="52" height="42" rx="10" fill="rgba(158,158,158,0.2)"/>
  <text x="360" y="133" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="16" fill="#424242">⏱</text>

  <!-- Timer value button -->
  <rect x="394" y="108" width="74" height="42" rx="10" fill="rgba(158,158,158,0.2)"/>
  <text x="431" y="133" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="18" font-weight="500" fill="#424242">30</text>
</svg>
