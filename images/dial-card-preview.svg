<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 310" width="500" height="310">
  <defs>
    <filter id="cs" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="8" flood-color="#000" flood-opacity="0.10"/>
    </filter>
    <filter id="ks" x="-150%" y="-150%" width="400%" height="400%">
      <feDropShadow dx="0" dy="1" stdDeviation="2.5" flood-color="#000" flood-opacity="0.22"/>
    </filter>
  </defs>

  <!-- Dashboard background -->
  <rect width="500" height="310" fill="#f0f2f5"/>

  <!--
    Arc geometry (matches card-circular.ts after 360° rewrite):
      CX=120/380  CY=148
      R=82
      FULL_CIRC = 2π×82 ≈ 515.22
      ARC_ROTATE = -90  (stroke starts at top / 12 o'clock)

    Handle positions (clock angle = minutes/60 × 360):
      0 min  → 0°   → top    → (120/380, 66)
      15 min → 90°  → right  → (202/462, 148)
      30 min → 180° → bottom → (120/380, 230)
      45 min → 270° → left   → (38/298,  148)
  -->

  <!-- ═══════════════════════════════════════════════════════════
       LEFT CARD — dial set to 45 min, device OFF (pre-set)
       ═══════════════════════════════════════════════════════════ -->
  <rect x="18" y="18" width="204" height="262" rx="14"
        fill="white" filter="url(#cs)"/>

  <!-- Gray background track (full circle) -->
  <circle cx="120" cy="148" r="82" fill="none"
    stroke="rgba(128,128,128,0.17)" stroke-width="13"/>

  <!-- Active arc: 45 min = 75% → activeDash = 515.22×0.75 = 386.41 -->
  <circle cx="120" cy="148" r="82" fill="none"
    stroke="#F54436" stroke-width="13" stroke-linecap="round"
    stroke-dasharray="386.41 128.81"
    transform="rotate(-90,120,148)"/>

  <!-- Tick dots at 0 / 15 / 30 min (skip 45 — handle is there) -->
  <circle cx="120" cy="66"  r="2.5" fill="rgba(128,128,128,0.40)"/>
  <circle cx="202" cy="148" r="2.5" fill="rgba(128,128,128,0.40)"/>
  <circle cx="120" cy="230" r="2.5" fill="rgba(128,128,128,0.40)"/>

  <!-- Inner text -->
  <text x="120" y="112" text-anchor="middle" dominant-baseline="middle"
    font-family="system-ui,-apple-system,sans-serif" font-size="13" fill="#9e9e9e">Boiler</text>
  <text x="120" y="144" text-anchor="middle" dominant-baseline="middle"
    font-family="system-ui,-apple-system,sans-serif" font-size="40" font-weight="600" fill="#212121">45</text>
  <text x="120" y="168" text-anchor="middle" dominant-baseline="middle"
    font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#9e9e9e">min</text>
  <text x="120" y="184" text-anchor="middle" dominant-baseline="middle"
    font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#616161">off</text>

  <!-- Handle at 45 min → left (38, 148) -->
  <circle cx="38" cy="148" r="11" fill="white" stroke="#F54436" stroke-width="2.5"
    filter="url(#ks)"/>

  <!-- Power button (off) -->
  <rect x="30" y="248" width="180" height="24" rx="8" fill="rgba(158,158,158,0.2)"/>
  <text x="120" y="260" text-anchor="middle" dominant-baseline="middle"
    font-family="system-ui,-apple-system,sans-serif" font-size="12" font-weight="500" fill="#424242">Turn On</text>

  <!-- Caption -->
  <text x="120" y="294" text-anchor="middle"
    font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#9e9e9e">Drag knob to set timer</text>


  <!-- ═══════════════════════════════════════════════════════════
       RIGHT CARD — 30 min running, device ON
       ═══════════════════════════════════════════════════════════ -->
  <rect x="278" y="18" width="204" height="262" rx="14"
        fill="white" filter="url(#cs)"/>

  <!-- Gray background track (full circle) -->
  <circle cx="380" cy="148" r="82" fill="none"
    stroke="rgba(128,128,128,0.17)" stroke-width="13"/>

  <!-- Active arc: 30 min = 50% → activeDash = 515.22×0.5 = 257.61 -->
  <circle cx="380" cy="148" r="82" fill="none"
    stroke="#F54436" stroke-width="13" stroke-linecap="round"
    stroke-dasharray="257.61 257.61"
    transform="rotate(-90,380,148)"/>

  <!-- Tick dots at 0 / 15 / 45 min (skip 30 — handle is there) -->
  <circle cx="380" cy="66"  r="2.5" fill="rgba(128,128,128,0.40)"/>
  <circle cx="462" cy="148" r="2.5" fill="rgba(128,128,128,0.40)"/>
  <circle cx="298" cy="148" r="2.5" fill="rgba(128,128,128,0.40)"/>

  <!-- Inner text -->
  <text x="380" y="112" text-anchor="middle" dominant-baseline="middle"
    font-family="system-ui,-apple-system,sans-serif" font-size="13" fill="#9e9e9e">Boiler</text>
  <text x="380" y="144" text-anchor="middle" dominant-baseline="middle"
    font-family="system-ui,-apple-system,sans-serif" font-size="40" font-weight="600" fill="#212121">30</text>
  <text x="380" y="168" text-anchor="middle" dominant-baseline="middle"
    font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#9e9e9e">min</text>
  <text x="380" y="184" text-anchor="middle" dominant-baseline="middle"
    font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#616161">00:28:45</text>
  <text x="380" y="198" text-anchor="middle" dominant-baseline="middle"
    font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#9e9e9e">2.4 kW</text>

  <!-- Handle at 30 min → bottom (380, 230) -->
  <circle cx="380" cy="230" r="11" fill="white" stroke="#F54436" stroke-width="2.5"
    filter="url(#ks)"/>

  <!-- Power button (on = red) -->
  <rect x="290" y="248" width="180" height="24" rx="8" fill="#F54436"/>
  <text x="380" y="260" text-anchor="middle" dominant-baseline="middle"
    font-family="system-ui,-apple-system,sans-serif" font-size="12" font-weight="500" fill="white">Turn Off</text>

  <!-- Caption -->
  <text x="380" y="294" text-anchor="middle"
    font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#9e9e9e">Timer running — tap name for details</text>
</svg>
