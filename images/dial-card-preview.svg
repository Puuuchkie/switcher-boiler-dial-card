<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 310" width="500" height="310">
  <defs>
    <filter id="cs" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="8" flood-color="#000" flood-opacity="0.10"/>
    </filter>
    <filter id="ks" x="-150%" y="-150%" width="400%" height="400%">
      <feDropShadow dx="0" dy="1" stdDeviation="2.5" flood-color="#000" flood-opacity="0.22"/>
    </filter>
  </defs>

  <rect width="500" height="310" fill="#f0f2f5"/>

  <!-- ═══ LEFT — 45 min set, device OFF ═══ -->
  <rect x="18" y="18" width="204" height="262" rx="14" fill="white" filter="url(#cs)"/>

  <!-- Gray track -->
  <circle cx="120" cy="148" r="82" fill="none" stroke="rgba(128,128,128,0.17)" stroke-width="13"/>
  <!-- Active arc 75% = 386.41 of 515.22 -->
  <circle cx="120" cy="148" r="82" fill="none" stroke="#F54436" stroke-width="13" stroke-linecap="round"
    stroke-dasharray="386.41 128.81" transform="rotate(-90,120,148)"/>

  <!-- Tick dots at 0/15/30 min (skip 45 — handle there) -->
  <circle cx="120" cy="66"  r="2.5" fill="rgba(128,128,128,0.40)"/>
  <circle cx="202" cy="148" r="2.5" fill="rgba(128,128,128,0.40)"/>
  <circle cx="120" cy="230" r="2.5" fill="rgba(128,128,128,0.40)"/>

  <!-- Row 1: name -->
  <text x="120" y="110" text-anchor="middle" dominant-baseline="middle"
    font-family="system-ui,-apple-system,sans-serif" font-size="13" fill="#9e9e9e">Boiler</text>
  <!-- Row 2: big number -->
  <text x="120" y="148" text-anchor="middle" dominant-baseline="middle"
    font-family="system-ui,-apple-system,sans-serif" font-size="40" font-weight="600" fill="#212121">45</text>
  <!-- Row 3: state -->
  <text x="120" y="182" text-anchor="middle" dominant-baseline="middle"
    font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#616161">off</text>

  <!-- Handle at 45 min → left -->
  <circle cx="38" cy="148" r="11" fill="white" stroke="#F54436" stroke-width="2.5" filter="url(#ks)"/>

  <!-- Power button -->
  <rect x="30" y="248" width="180" height="24" rx="8" fill="rgba(158,158,158,0.2)"/>
  <text x="120" y="260" text-anchor="middle" dominant-baseline="middle"
    font-family="system-ui,-apple-system,sans-serif" font-size="12" font-weight="500" fill="#424242">Turn On</text>

  <text x="120" y="294" text-anchor="middle"
    font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#9e9e9e">Drag knob to set timer</text>


  <!-- ═══ RIGHT — running, device ON ═══ -->
  <rect x="278" y="18" width="204" height="262" rx="14" fill="white" filter="url(#cs)"/>

  <!-- Gray track -->
  <circle cx="380" cy="148" r="82" fill="none" stroke="rgba(128,128,128,0.17)" stroke-width="13"/>
  <!-- Active arc 50% = 257.61 -->
  <circle cx="380" cy="148" r="82" fill="none" stroke="#F54436" stroke-width="13" stroke-linecap="round"
    stroke-dasharray="257.61 257.61" transform="rotate(-90,380,148)"/>

  <!-- Tick dots at 0/15/45 min (skip 30 — handle there) -->
  <circle cx="380" cy="66"  r="2.5" fill="rgba(128,128,128,0.40)"/>
  <circle cx="462" cy="148" r="2.5" fill="rgba(128,128,128,0.40)"/>
  <circle cx="298" cy="148" r="2.5" fill="rgba(128,128,128,0.40)"/>

  <!-- Row 1: name -->
  <text x="380" y="110" text-anchor="middle" dominant-baseline="middle"
    font-family="system-ui,-apple-system,sans-serif" font-size="13" fill="#9e9e9e">Boiler</text>
  <!-- Row 2: countdown -->
  <text x="380" y="148" text-anchor="middle" dominant-baseline="middle"
    font-family="system-ui,-apple-system,sans-serif" font-size="26" font-weight="600" fill="#212121">0:28:45</text>
  <!-- Row 3: state · power -->
  <text x="380" y="182" text-anchor="middle" dominant-baseline="middle"
    font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#616161">on · 2.4kW</text>

  <!-- Handle at 30 min → bottom -->
  <circle cx="380" cy="230" r="11" fill="white" stroke="#F54436" stroke-width="2.5" filter="url(#ks)"/>

  <!-- Power button -->
  <rect x="290" y="248" width="180" height="24" rx="8" fill="#F54436"/>
  <text x="380" y="260" text-anchor="middle" dominant-baseline="middle"
    font-family="system-ui,-apple-system,sans-serif" font-size="12" font-weight="500" fill="white">Turn Off</text>

  <text x="380" y="294" text-anchor="middle"
    font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#9e9e9e">Timer running — tap name for details</text>
</svg>
